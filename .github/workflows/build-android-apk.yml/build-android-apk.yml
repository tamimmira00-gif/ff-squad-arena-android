
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FF_Squad_Arena_Android_Project.zip'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q FF_Squad_Arena_Android_Project.zip -d extracted
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/ff_squad_arena_android" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FF-Squad-Arena-APK
          path: extracted/ff_squad_arena_android/app/build/outputs/apk/debug/app-debug.apk
